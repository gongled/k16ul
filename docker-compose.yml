version: "2"
services:
  app:
    build:
      context: .
    command:
      - jekyll
      - serve
      - --drafts
      - --watch
      - --host=0.0.0.0
    expose:
      - 4000
    ports:
      - 4000:4000
    volumes:
      - .:/app
      - bundle:/usr/local/bundle
    environment:
      - LANG=C.UTF-8
      - LANGUAGE=C.UTF-8
      - LC_ALL=C.UTF-8

volumes:
  bundle:
